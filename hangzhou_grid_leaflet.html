<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市网格沙盘 · 租电动车选址分析（地图版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; overflow: hidden; }

  .header {
    padding: 0 24px;
    background: linear-gradient(135deg, #1a1d2e 0%, #12151f 100%);
    border-bottom: 1px solid #2a2d3e;
    display: flex; align-items: center; justify-content: space-between;
    height: 58px; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .header h1 { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: .5px; white-space: nowrap; }
  .header .sub { font-size: 11px; color: #666; margin-top: 2px; }
  .data-note { font-size: 11px; color: #555; background: #1e2030; border: 1px solid #2a2d3e; padding: 5px 10px; border-radius: 6px; white-space: nowrap; }

  /* ── 城市切换 Tab ── */
  .city-tabs {
    display: flex; gap: 4px; align-items: center;
    background: #0f1117; border: 1px solid #2a2d3e;
    border-radius: 8px; padding: 3px;
  }
  .city-tab {
    padding: 5px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; color: #888; transition: all .18s; white-space: nowrap;
    border: none; background: transparent;
  }
  .city-tab:hover { color: #ccc; background: #1e2130; }
  .city-tab.active { background: #2e3a5e; color: #5b8dee; font-weight: 600; }

  .main { display: flex; height: calc(100vh - 58px); }

  .sidebar {
    width: 240px; min-width: 240px; background: #13151f;
    border-right: 1px solid #1e2130; padding: 14px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px; z-index: 1000;
  }
  .panel-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

  .legend-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 7px; cursor: pointer;
    transition: background .15s; font-size: 13px;
    border: 1.5px solid transparent;
  }
  .legend-item:hover { background: #1e2130; }
  .legend-item.active { border-color: currentColor; background: #1e2130; }
  .legend-dot { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { flex: 1; }
  .legend-count { font-size: 11px; color: #555; }

  .filter-row { display: flex; flex-direction: column; gap: 6px; }
  .filter-row label { font-size: 12px; color: #777; }
  .filter-row input[type=range] { width: 100%; accent-color: #5b8dee; }

  .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: #1a1d2e; border: 1px solid #252840; border-radius: 8px; padding: 10px; text-align: center; }
  .stat-card .val { font-size: 20px; font-weight: 700; color: #fff; }
  .stat-card .lbl { font-size: 10px; color: #666; margin-top: 2px; }

  .basemap-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .basemap-btn {
    flex: 1; min-width: 55px; padding: 5px 6px; border-radius: 6px;
    background: #1a1d2e; border: 1px solid #252840; color: #aaa;
    font-size: 11px; cursor: pointer; text-align: center; transition: all .15s;
  }
  .basemap-btn:hover { background: #252840; color: #fff; }
  .basemap-btn.active { background: #2e3a5e; border-color: #5b8dee; color: #5b8dee; }

  .opacity-row { display: flex; align-items: center; gap: 8px; }
  .opacity-row label { font-size: 12px; color: #777; white-space: nowrap; }
  .opacity-row input { flex: 1; accent-color: #5b8dee; }
  .opacity-val { font-size: 12px; color: #aaa; min-width: 28px; text-align: right; }

  #map { flex: 1; z-index: 0; }

  #tooltip {
    position: fixed; z-index: 9999; pointer-events: none;
    background: #1a1d2e; border: 1px solid #2e3250;
    border-radius: 10px; padding: 14px 16px; min-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .15s;
  }
  #tooltip.show { opacity: 1; }
  .tt-header { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .tt-dot { width: 10px; height: 10px; border-radius: 2px; }
  .tt-rows { display: flex; flex-direction: column; gap: 5px; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .tt-row .name { color: #888; }
  .tt-row .bar-wrap { flex: 1; margin: 0 8px; height: 5px; background: #252840; border-radius: 3px; overflow: hidden; }
  .tt-row .bar-fill { height: 100%; border-radius: 3px; }
  .tt-row .score { color: #fff; font-weight: 600; min-width: 28px; text-align: right; }
  .tt-dominant { margin-top: 10px; font-size: 11px; color: #888; }
  .tt-dominant span { color: #fff; font-weight: 600; }

  #detail-panel {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 0; overflow: hidden; background: #13151f;
    border-left: 1px solid #1e2130; transition: width .25s;
    z-index: 1000;
  }
  #detail-panel.open { width: 260px; }
  .detail-inner { width: 260px; padding: 18px 14px; }
  .detail-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .detail-sub { font-size: 12px; color: #666; margin-bottom: 14px; }
  .score-ring-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  .attr-bars { display: flex; flex-direction: column; gap: 9px; }
  .attr-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .attr-bar-label .aname { color: #aaa; }
  .attr-bar-label .ascore { color: #fff; font-weight: 600; }
  .attr-bar-bg { height: 6px; background: #1e2130; border-radius: 4px; overflow: hidden; }
  .attr-bar-fill { height: 100%; border-radius: 4px; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .detail-tag-wrap { margin-top: 12px; }
  .detail-tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .detail-desc { margin-top: 10px; font-size: 12px; color: #666; line-height: 1.7; }
  .close-btn {
    position: absolute; top: 12px; right: 12px; width: 24px; height: 24px;
    background: #252840; border: none; border-radius: 50%; color: #888;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: #2e3250; color: #fff; }

  .data-badge {
    position: absolute; bottom: 28px; left: 248px; z-index: 1000;
    font-size: 10px; color: #888; background: rgba(13,15,24,.85);
    padding: 5px 10px; border-radius: 6px; border: 1px solid #1e2130;
    line-height: 1.6; pointer-events: none;
  }

  .leaflet-container { background: #e8e0d8; }
  .leaflet-control-zoom a { background: #1a1d2e; color: #aaa; border-color: #2a2d3e; }
  .leaflet-control-zoom a:hover { background: #252840; color: #fff; }
  .leaflet-control-attribution { background: rgba(13,15,24,.7) !important; color: #444 !important; }
  .leaflet-control-attribution a { color: #555 !important; }

  /* ── 门店标记 ── */
  .store-marker-wrap {
    pointer-events: none;
  }
  .store-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffcc00; border: 1.5px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.7);
    display: inline-block;
  }
  .store-dot.more {
    background: #ff8c00; font-size: 7px; color: #fff;
    width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; border: 1.5px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.7);
  }

  /* ── 详情面板门店列表 ── */
  .store-list-section { margin-top: 14px; }
  .store-list-title {
    font-size: 11px; font-weight: 600; color: #888;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .store-list-title .store-count {
    background: #ffcc0033; color: #ffcc00; border: 1px solid #ffcc0055;
    border-radius: 10px; padding: 1px 7px; font-size: 10px; font-weight: 700;
  }
  .store-item {
    background: #1a1d2e; border: 1px solid #252840; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px;
  }
  .store-item-name {
    font-size: 12px; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .store-item-branch {
    font-size: 11px; color: #888; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .store-item-phone {
    font-size: 11px; color: #5b8dee; margin-top: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .store-item-score {
    display: inline-block; font-size: 10px; color: #ffcc00;
    background: #ffcc0015; border: 1px solid #ffcc0030;
    border-radius: 4px; padding: 1px 5px; margin-top: 3px;
  }
  .store-show-more {
    text-align: center; font-size: 11px; color: #5b8dee;
    cursor: pointer; padding: 5px; border-radius: 6px;
    border: 1px dashed #2a3a5e; margin-top: 2px;
    transition: background .15s;
  }
  .store-show-more:hover { background: #1e2a40; }

</style>
</head>

<div class="header">

      <h1 id="page-title">城市网格沙盘 · 6类属性评分（地图版）</h1>

    </div>

      <button class="city-tab active" data-city="hangzhou">🏯 杭州</button>

    </div>
  </div>
  <div class="data-note">数据来源：基于公开地理信息估算 · 仅供参考</div>
</div>

<div class="main">
  <div class="sidebar">
    <div>
      <div class="panel-title">属性图例</div>

    </div>

      </div>
    </div>
    <div>
      <div class="panel-title">网格透明度</div>
      <div class="opacity-row">
        <label>透明度</label>
        <input type="range" id="opacity-slider" min="20" max="90" value="55" step="5">
        <span class="opacity-val" id="opacity-val">55%</span>
      </div>
    </div>
    <div>
      <div class="panel-title">最低分筛选</div>
      <div class="filter-row">
        <label>显示主属性分数 ≥ <span id="filter-val-display">0</span></label>

    </div>
    <div>

      <div class="stat-cards" id="stat-cards"></div>
    </div>
    <div>
      <div class="panel-title">打分说明</div>
      <div style="font-size:11px;color:#555;line-height:1.8">
        各类POI数量在全部100个网格中排名，转换为0-99分（中位排名法）。主标签取6项中最高分属性。
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div id="detail-panel">
    <div class="detail-inner" style="position:relative">
      <button class="close-btn" id="close-detail">×</button>
      <div class="detail-title" id="dp-name">—</div>
      <div class="detail-sub" id="dp-coord">—</div>
      <div class="score-ring-wrap">
        <canvas id="score-canvas" width="120" height="120"></canvas>
      </div>
      <div class="attr-bars" id="dp-bars"></div>
      <div class="detail-tag-wrap"><span class="detail-tag" id="dp-tag">—</span></div>
      <div class="detail-desc" id="dp-desc">—</div>
    </div>
  </div>
</div>

<div class="data-badge" id="data-badge">

  坐标系：WGS-84 · 杭州 120.065°~120.415° / 30.11°~30.38°
</div>

<div id="tooltip">

// ═══════════════════════════════════════════════════════
//  5. 打分算法（通用）
// ═══════════════════════════════════════════════════════
function computeScores(rawData) {
  const catKeys = ['residential','commercial','scenic','office','industrial','transport'];
  const catIdx  = [3,4,5,6,7,8];
  const allVals = {};
  catKeys.forEach((k,i) => {
    allVals[k] = rawData.map(r => r[catIdx[i]]).sort((a,b) => a-b);
  });
  function pctScore(val, sorted) {
    const n = sorted.length;
    let below = 0, equal = 0;
    for (let i = 0; i < n; i++) {
      if (sorted[i] < val) below++;
      else if (sorted[i] === val) equal++;
    }
    return Math.round(Math.max(0, Math.min(1, (below + (equal-1)/2) / (n-1))) * 99);
  }
  return rawData.map(r => {
    const scores = {};
    catKeys.forEach((k,i) => { scores[k] = pctScore(r[catIdx[i]], allVals[k]); });
    let dominant = catKeys[0], maxS = scores[catKeys[0]];
    catKeys.forEach(k => { if (scores[k] > maxS) { maxS = scores[k]; dominant = k; } });
    return { row: r[0], col: r[1], name: r[2], scores, dominant, maxScore: maxS };
  });
}

// ═══════════════════════════════════════════════════════
//  6. 坐标转换（按城市配置）
// ═══════════════════════════════════════════════════════
function cellBounds(row, col, cfg) {
  const lngStep = (cfg.lngMax - cfg.lngMin) / cfg.cols;
  const latStep = (cfg.latMax - cfg.latMin) / cfg.rows;
  const latTop    = cfg.latMax - row * latStep;
  const latBottom = cfg.latMax - (row + 1) * latStep;
  const lngLeft   = cfg.lngMin + col * lngStep;
  const lngRight  = cfg.lngMin + (col + 1) * lngStep;
  return [[latBottom, lngLeft], [latTop, lngRight]];
}

let activeFilter = null;
let minScore = 0;
let gridOpacity = 0.55;
let gridLayers = [];

function getCatByKey(k) { return CATEGORIES.find(c => c.key === k); }
function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}

function buildGridOverlay() {
  gridLayers.forEach(l => map.removeLayer(l));
  gridLayers = [];

  const gridData = CITY_DATA[currentCity];
  const c = cfg();

  gridData.forEach(cell => {
    const cat = getCatByKey(cell.dominant);
    const color = cat.color;
    const displayScore = activeFilter ? cell.scores[activeFilter] : cell.maxScore;
    const isDimmed = displayScore < minScore;
    const bounds = cellBounds(cell.row, cell.col, c);
    const fillAlpha = isDimmed ? 0.05 : (0.18 + (displayScore / 99) * 0.52) * gridOpacity;
    const {r,g,b} = hexToRgb(color);

    const rect = L.rectangle(bounds, {
      color: `rgba(${r},${g},${b},${isDimmed ? 0.12 : 0.70})`,
      weight: 1,
      fillColor: color,
      fillOpacity: fillAlpha,
    });

    const center = [(bounds[0][0]+bounds[1][0])/2, (bounds[0][1]+bounds[1][1])/2];
    const labelIcon = L.divIcon({
      className: '',
      html: `<div style="text-align:center;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;${isDimmed?'opacity:0.2':''}">
        <div style="font-size:9px;font-weight:600;color:rgba(255,255,255,.95);text-shadow:0 1px 4px rgba(0,0,0,.99),0 0 8px rgba(0,0,0,.8);line-height:1.3">${cell.name}</div>
        <div style="font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.99)">${displayScore}</div>
        <div style="font-size:8px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.5);border-radius:3px;padding:1px 3px;display:inline-block">${cat.icon} ${cat.label}</div>
      </div>`,
      iconSize: [0,0], iconAnchor: [0,0],
    });
    const marker = L.marker(center, { icon: labelIcon, interactive: false });

    rect.on('mouseover', (e) => showTooltip(e.originalEvent, cell));
    rect.on('mousemove', (e) => moveTooltip(e.originalEvent));
    rect.on('mouseout', hideTooltip);
    rect.on('click', () => openDetail(cell));

    rect.addTo(map);
    marker.addTo(map);
    gridLayers.push(rect, marker);
  });
}

  document.getElementById('tt-dominant').textContent = `${dom.icon} ${dom.label}（${cell.maxScore}分）`;

function moveTooltip(e) {
  const tw=240, th=200;
  let x=e.clientX+14, y=e.clientY+14;
  if (x+tw>window.innerWidth) x=e.clientX-tw-10;
  if (y+th>window.innerHeight) y=e.clientY-th-10;
  tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

function drawRadar(cell) {
  const canvas = document.getElementById('score-canvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, R=46, n=6;
  const vals = CATEGORIES.map(c => cell.scores[c.key]/99);
  for (let ring=1; ring<=4; ring++) {
    ctx.beginPath();
    for (let i=0; i<n; i++) {
      const a=(i/n)*Math.PI*2-Math.PI/2, r=R*ring/4;
      i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    }
    ctx.closePath(); ctx.strokeStyle='#252840'; ctx.lineWidth=1; ctx.stroke();
  }
  for (let i=0; i<n; i++) {
    const a=(i/n)*Math.PI*2-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
    ctx.strokeStyle='#252840'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.beginPath();
  vals.forEach((v,i) => {
    const a=(i/n)*Math.PI*2-Math.PI/2, r=R*v;
    i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  });
  ctx.closePath();
  const color=getCatByKey(cell.dominant).color;
  const {r,g,b}=hexToRgb(color);
  ctx.fillStyle=`rgba(${r},${g},${b},0.25)`; ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  vals.forEach((v,i) => {
    const a=(i/n)*Math.PI*2-Math.PI/2, rr=R*v;
    ctx.beginPath(); ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
  });
  ctx.font='9px -apple-system,PingFang SC,sans-serif'; ctx.fillStyle='#666'; ctx.textAlign='center'; ctx.textBaseline='middle';
  CATEGORIES.forEach((cat,i) => {
    const a=(i/n)*Math.PI*2-Math.PI/2, lr=R+14;
    ctx.fillText(cat.label, cx+lr*Math.cos(a), cy+lr*Math.sin(a));
  });
}

function buildLegend() {
  const el = document.getElementById('legend-list');
  el.innerHTML = '';
  const gridData = CITY_DATA[currentCity];
  CATEGORIES.forEach(cat => {
    const count = gridData.filter(c => c.dominant===cat.key).length;
    const item = document.createElement('div');
    item.className = 'legend-item'; item.style.color = cat.color;
    item.innerHTML = `<div class="legend-dot" style="background:${cat.color}"></div><span class="legend-label">${cat.icon} ${cat.label}</span><span class="legend-count">${count}格</span>`;
    item.addEventListener('click', () => {
      if (activeFilter===cat.key) { activeFilter=null; item.classList.remove('active'); }
      else { document.querySelectorAll('.legend-item').forEach(i=>i.classList.remove('active')); activeFilter=cat.key; item.classList.add('active'); }
      buildGridOverlay();
    });
    el.appendChild(item);
  });
}

function buildStats() {
  const el = document.getElementById('stat-cards');
  const gridData = CITY_DATA[currentCity];
  const total = gridData.length;
  const avgMax = Math.round(gridData.reduce((s,c)=>s+c.maxScore,0)/total);
  const topCount = gridData.filter(c=>c.maxScore>=80).length;
  const catCounts = {};
  CATEGORIES.forEach(c => { catCounts[c.key]=gridData.filter(d=>d.dominant===c.key).length; });
  const topCat = CATEGORIES.reduce((a,b)=>catCounts[a.key]>catCounts[b.key]?a:b);
  el.innerHTML = `
    <div class="stat-card"><div class="val">${total}</div><div class="lbl">总网格数</div></div>
    <div class="stat-card"><div class="val">${avgMax}</div><div class="lbl">平均主属性分</div></div>
    <div class="stat-card"><div class="val">${topCount}</div><div class="lbl">高分格(≥80)</div></div>
    <div class="stat-card"><div class="val" style="color:${topCat.color}">${topCat.label}</div><div class="lbl">最多主属性</div></div>`;
}

function switchCity(cityKey) {
  if (cityKey === currentCity) return;
  currentCity = cityKey;
  const c = cfg();

  // 关闭详情面板
  document.getElementById('detail-panel').classList.remove('open');
  // 重置筛选
  activeFilter = null;
  document.querySelectorAll('.legend-item').forEach(i=>i.classList.remove('active'));
  minScore = 0;
  document.getElementById('score-filter').value = 0;
  document.getElementById('filter-val-display').textContent = '0';

  // 更新标题和坐标说明
  document.getElementById('page-sub').textContent =
    `约3.5km × 3km 网格 · ${c.name}主城区 · Leaflet.js + OpenStreetMap`;
  document.getElementById('data-badge').innerHTML =
    `⚠ 数据为基于公开信息的估算值，非实时POI抓取<br>${c.badge}`;

  // 飞到新城市
  map.flyTo(c.center, c.zoom, { duration: 1.2 });

  // 重建图例、统计、网格
  buildLegend();
  buildStats();
  buildGridOverlay();
  buildStoreOverlay();
}

//  门店标记层
// ═══════════════════════════════════════════════════════
let storeLayers = [];
const MAX_DOTS_PER_CELL = 3;

function buildStoreOverlay() {
  storeLayers.forEach(l => map.removeLayer(l));
  storeLayers = [];

  const c = cfg();
  const cityStores = STORE_DATA[currentCity] || {};

  Object.entries(cityStores).forEach(([key, stores]) => {
    const [row, col] = key.split('_').map(Number);
    const bounds = cellBounds(row, col, c);
    const cellLngMin = bounds[0][1], cellLngMax = bounds[1][1];
    const cellLatMin = bounds[0][0], cellLatMax = bounds[1][0];

    // 在格子内均匀分布最多 MAX_DOTS_PER_CELL 个点
    const shown = stores.slice(0, MAX_DOTS_PER_CELL);
    const remaining = stores.length - shown.length;

    shown.forEach((store, idx) => {
      // 使用真实经纬度，但 clamp 到格子范围内
      const lat = Math.max(cellLatMin + 0.002, Math.min(cellLatMax - 0.002, store.lat));
      const lng = Math.max(cellLngMin + 0.002, Math.min(cellLngMax - 0.002, store.lng));

      const dotIcon = L.divIcon({
        className: 'store-marker-wrap',
        html: `<div class="store-dot" title="${store.name} ${store.branch}"></div>`,
        iconSize: [8, 8],
        iconAnchor: [4, 4],
      });
      const m = L.marker([lat, lng], { icon: dotIcon, interactive: false, zIndexOffset: 500 });
      m.addTo(map);
      storeLayers.push(m);
    });

    // 如果有更多门店，在格子右下角显示 +N 气泡
    if (remaining > 0) {
      const bubbleLat = cellLatMin + (cellLatMax - cellLatMin) * 0.18;
      const bubbleLng = cellLngMin + (cellLngMax - cellLngMin) * 0.82;
      const bubbleIcon = L.divIcon({
        className: 'store-marker-wrap',
        html: `<div class="store-dot more">+${remaining}</div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });
      const bm = L.marker([bubbleLat, bubbleLng], { icon: bubbleIcon, interactive: false, zIndexOffset: 600 });
      bm.addTo(map);
      storeLayers.push(bm);
    }
  });
}

// ═══════════════════════════════════════════════════════
//  详情面板：门店列表
// ═══════════════════════════════════════════════════════
const STORES_INITIAL_SHOW = 5;

function buildStoreList(cell) {
  const key = `${cell.row}_${cell.col}`;
  const cityStores = STORE_DATA[currentCity] || {};
  const stores = cityStores[key] || [];

  // 移除旧的门店区块
  const old = document.getElementById('store-list-section');
  if (old) old.remove();

  if (stores.length === 0) return;

  const section = document.createElement('div');
  section.id = 'store-list-section';
  section.className = 'store-list-section';

  section.innerHTML = `<div class="store-list-title">📍 门店列表 <span class="store-count">${stores.length} 家</span></div>`;

  const listWrap = document.createElement('div');
  listWrap.id = 'store-list-wrap';

  function renderItems(limit) {
    listWrap.innerHTML = '';
    stores.slice(0, limit).forEach(s => {
      const item = document.createElement('div');
      item.className = 'store-item';
      const phoneHtml = s.phone
        ? `<div class="store-item-phone">📞 ${s.phone}</div>`
        : '';
      const scoreHtml = s.score > 0
        ? `<span class="store-item-score">⭐ ${s.score.toFixed(1)}</span>`
        : '';
      item.innerHTML = `
        <div class="store-item-name">${s.name}</div>
        ${s.branch ? `<div class="store-item-branch">${s.branch}</div>` : ''}
        ${phoneHtml}
        ${scoreHtml}
      `;
      listWrap.appendChild(item);
    });

    if (limit < stores.length) {
      const more = document.createElement('div');
      more.className = 'store-show-more';
      more.textContent = `展开全部 ${stores.length} 家门店 ▾`;
      more.addEventListener('click', () => renderItems(stores.length));
      listWrap.appendChild(more);
    }
  }

  renderItems(STORES_INITIAL_SHOW);
  section.appendChild(listWrap);

  // 插入到 detail-inner 末尾
  document.querySelector('.detail-inner').appendChild(section);
}
